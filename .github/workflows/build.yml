name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/toggles

defaults:
  run:
    working-directory: toggles

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: toggles

      - uses: jdx/mise-action@v2
        with:
          working_directory: toggles

      - uses: taiki-e/install-action@nextest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            toggles/target
          key: cargo-${{ hashFiles('toggles/Cargo.lock', 'toggles/rust-toolchain.toml') }}
          restore-keys: |
            cargo-

      - run: mise run check
      - run: mise run test
      - run: mise run build-mod

      - uses: actions/upload-artifact@v7
        with:
          name: alaydriem-toggles-${{ github.sha }}-windows-x64
          path: toggles/dist/@alaydriem/toggles/
