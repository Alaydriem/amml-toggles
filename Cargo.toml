[workspace]
resolver = "3"
members = ["src/core", "src/amml"]

[workspace.package]
version = "26.62.0"
edition = "2024"
rust-version = "1.98"
authors = ["Charles R. Portwood II"]
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
amm-abi = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.4" }
amm-client = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.4", default-features = false }
amm-core = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.4" }
amml-sdk = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.4" }
amml-game = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.4" }
curia = "=0.2.2"
hcl-rs = "=0.19.8"
serde = { version = "1.0.229", features = ["derive"] }
toggles-core = { path = "src/core" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
